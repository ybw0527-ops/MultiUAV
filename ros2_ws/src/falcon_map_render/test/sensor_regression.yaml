/**:
  ros__parameters:
    transformer:
      pose_topic_type: transform
      sensor_pose_topic: /uav_simulator/sensor_pose
    uav_model:
      sensing_parameters:
        image_width: 80
        image_height: 60
        camera_intrinsics:
          fx: 40.0
          fy: 40.0
          cx: 40.0
          cy: 30.0
    voxel_mapping:
      resolution_fine: 0.5
      resolution_coarse: 0.5
      skip_pixel: 2
      publish_tsdf: false
      publish_esdf: false
      publish_occupancy_grid: false
      publish_tsdf_slice: false
      publish_esdf_slice: false
      publish_occupancy_grid_slice: false
    map_render:
      render_rate: 10.0
    exploration_manager:
      auto_start: false
