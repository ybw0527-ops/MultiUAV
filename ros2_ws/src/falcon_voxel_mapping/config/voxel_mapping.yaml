/**:
  ros__parameters:
    voxel_mapping:
      mode: "uav_simulator"
      resolution_fine: 0.1
      resolution_coarse: 0.2

      depth_filter_margin: 0
      depth_scaling_factor: 1000.0
      depth_decimation_filter: false
      skip_pixel: 4
      concurrent_depth_input_max: 1
      concurrent_pointcloud_input_max: 1
      save_map_path: "map.pcd"

      publish_tsdf: true
      publish_esdf: true
      publish_occupancy_grid: true
      publish_tsdf_slice: true
      publish_esdf_slice: true
      publish_occupancy_grid_slice: true
      publish_tsdf_period: 1.0
      publish_esdf_period: 1.0
      publish_occupancy_grid_period: 1.0
      tsdf_slice_height: 0.5
      tsdf_slice_visualization_height: 0.5
      esdf_slice_height: 1.0
      esdf_slice_visualization_height: -1.0
      occupancy_grid_slice_height: 0.5
      occupancy_grid_slice_visualization_height: 0.5

      verbose: false
      verbose_time: false

      tsdf:
        truncated_distance_scale: 2.0
        raycast_min: 0.0
        raycast_max: 5.0
        epsilon: 0.0001

      occupancy_grid:
        sdf_cutoff_distance_scale: 0.5
        mode: "GEN_TSDF"

    map_config:
      map_size:
        map_min_x: -10.0
        map_min_y: -10.0
        map_min_z: 0.0
        map_max_x: 10.0
        map_max_y: 10.0
        map_max_z: 5.0
        box_min_x: -10.0
        box_min_y: -10.0
        box_min_z: 0.0
        box_max_x: 10.0
        box_max_y: 10.0
        box_max_z: 5.0
        vbox_min_x: -10.0
        vbox_min_y: -10.0
        vbox_min_z: 0.0
        vbox_max_x: 10.0
        vbox_max_y: 10.0
        vbox_max_z: 5.0

    uav_model:
      sensing_parameters:
        camera_intrinsics:
          fx: 320.0
          fy: 320.0
          cx: 320.0
          cy: 240.0

    transformer:
      world_frame: "world"
      sensor_frame: "camera"
      sensor_pose_topic: "/sensor_pose"
      pose_topic_type: "transform"
      timestamp_tolerance: 0.001
      queue_limit: 1000
      verbose: false
